name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install optuna==4.8.0 cmaes==0.12.0
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  python-sdk:
    name: Python SDK / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.12", "3.14"]
        include:
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ./python[test]
      - run: python -m mypy python/src
      - run: python -m ruff check python/src python/tests
      - if: matrix.python == '3.14'
        run: cd python && python -m coverage run --parallel-mode -m pytest
      - if: matrix.python != '3.14'
        run: cd python && python -m pytest
      - run: python -m build --outdir /tmp/autotune-python-dist python
      - if: matrix.python == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ runner.os }}
          path: python/.coverage.*
          include-hidden-files: true
          if-no-files-found: error

  python-sdk-windows:
    name: Python SDK / Windows / Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ./python[test]
      - if: matrix.python == '3.14'
        run: cd python && python -m coverage run --parallel-mode -m pytest tests/test_windows_transport.py
      - if: matrix.python != '3.14'
        run: python -m pytest python/tests/test_windows_transport.py
      - if: matrix.python == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ runner.os }}
          path: python/.coverage.*
          include-hidden-files: true
          if-no-files-found: error

  python-coverage:
    name: Python SDK / Combined coverage
    needs: [python-sdk, python-sdk-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - run: python -m pip install ./python[test]
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: python/coverage-data
          merge-multiple: true
      - run: |
          cd python
          python -m coverage combine coverage-data
          python -m coverage report
