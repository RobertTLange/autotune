parameters:
  - name: depth
    cli_flag: --depth
    type: int
    low: 8
    high: 20
    current_value: 16
  - name: aspect_ratio
    cli_flag: --aspect-ratio
    type: int
    low: 32
    high: 80
    current_value: 56
  - name: head_dim
    cli_flag: --head-dim
    type: categorical
    choices: [64, 128]
    current_value: 64
  - name: batch_config
    cli_flag: --batch-config
    type: categorical
    choices:
      - 8x131072
      - 8x262144
      - 8x524288
      - 8x1048576
      - 8x2097152
      - 16x262144
      - 16x524288
      - 16x1048576
      - 16x2097152
      - 32x524288
      - 32x1048576
      - 32x2097152
    current_value: 32x1048576
  - name: embedding_lr
    cli_flag: --embedding-lr
    type: float
    low: 0.01
    high: 2.0
    log: true
    current_value: 0.6
  - name: unembedding_lr
    cli_flag: --unembedding-lr
    type: float
    low: 0.0005
    high: 0.05
    log: true
    current_value: 0.004
  - name: matrix_lr
    cli_flag: --matrix-lr
    type: float
    low: 0.005
    high: 0.2
    log: true
    current_value: 0.04
  - name: scalar_lr
    cli_flag: --scalar-lr
    type: float
    low: 0.05
    high: 2.0
    log: true
    current_value: 0.5
  - name: weight_decay
    cli_flag: --weight-decay
    type: float
    low: 0.0
    high: 0.5
    current_value: 0.2
  - name: warmup_ratio
    cli_flag: --warmup-ratio
    type: float
    low: 0.0
    high: 0.3
    current_value: 0.0
  - name: warmdown_ratio
    cli_flag: --warmdown-ratio
    type: float
    low: 0.1
    high: 0.8
    current_value: 0.5
  - name: final_lr_frac
    cli_flag: --final-lr-frac
    type: float
    low: 0.0
    high: 0.2
    current_value: 0.0
  - name: window_pattern
    cli_flag: --window-pattern
    type: categorical
    choices: [LLLL, SLSL, SSSS]
    current_value: LLLL
has_arg_parsing: true
needs_wrapper: false
has_metric_output: true
direction: minimize
failure_value: 100.0
optuna:
  sampler: tpe
  pruner: none
  reasoning: TPE over paired valid 8-GPU batch configs; no pruner because only final val_bpb is reported.
reasoning: Minimize nanochat validation bits-per-byte. The narrowed 8-GPU H100 space uses valid batch pairs with device batch sizes 8, 16, and 32; OOM and failed trials are penalized with val_bpb 100.0.
