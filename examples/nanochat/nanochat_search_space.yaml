has_arg_parsing: true
needs_wrapper: false
has_metric_output: true
direction: minimize
failure_value: 100.0
optuna:
  sampler: tpe
  pruner: none
  reasoning: TPE over paired single-GPU batch configs; no pruner because only final val_bpb is reported.
reasoning: Minimize canonical autoresearch validation bits-per-byte after 300 measured training seconds. Only HPO constants vary; the 2048 context, 8192-token vocabulary, 20,971,520-token evaluation, data, tokenizer, and evaluator remain fixed.
